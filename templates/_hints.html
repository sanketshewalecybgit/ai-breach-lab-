<div class="hint-box" data-challenge="{{ challenge.id }}"><h3>Progressive hints</h3><ol class="hint-list">{% for hint in challenge.hints[:progress[challenge.id].hints_used] %}<li>{{ hint }}</li>{% endfor %}</ol><button class="btn btn-hint reveal-hint" {% if progress[challenge.id].hints_used == 3 or not identity %}disabled{% endif %}>{% if progress[challenge.id].hints_used == 3 %}All hints revealed{% elif not identity %}Select a demo identity to reveal hints{% else %}SHOW HINT {{ progress[challenge.id].hints_used + 1 }}{% endif %}</button><small class="hint-usage">{{ progress[challenge.id].hints_used }} / 3 hints used · No score penalty</small><p class="hint-error text-danger" role="alert"></p></div>
